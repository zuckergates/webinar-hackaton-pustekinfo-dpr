# Only this disposable internal lab uses local trust for container administration.
local all all trust
host all all 127.0.0.1/32 scram-sha-256
host all all ::1/128 scram-sha-256
# Baseline and query-only checkpoints deliberately permit plaintext DB transport.
host invoice_lab lab_admin 172.30.26.20/32 scram-sha-256
host invoice_lab lab_admin 172.30.26.21/32 scram-sha-256
# Hardened runtime and designated test/admin client require TLS.
hostssl invoice_lab app_runtime 172.30.26.22/32 scram-sha-256
hostssl invoice_lab app_runtime 172.30.26.40/32 scram-sha-256
hostssl invoice_lab lab_admin 172.30.26.40/32 scram-sha-256
hostssl /^invoice_restore_ app_runtime 172.30.26.40/32 scram-sha-256
# Source .30 is intentionally denied even when it has valid credentials.
host all all 0.0.0.0/0 reject
host all all ::/0 reject
